    <!-- Apply the saved/system theme before first paint to avoid a flash of
         the wrong theme. Keep the storage key in sync with ThemeContext.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          // Dark is the brand default; only an explicit light choice opts out.
          if (stored !== 'light') document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
